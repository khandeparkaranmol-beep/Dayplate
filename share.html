.snapshot-card header{display:flex;gap:12px;align-items:center;background:#eef5ef;padding:16px 18px}
.snapshot-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:#d6e8d7;color:#20573f;font-size:26px}
.snapshot-card header small,.snapshot-group small,.snapshot-card li small{color:#51675d}.snapshot-card small{font-size:.86rem}
.snapshot-card h3,.snapshot-card h4,.snapshot-card dl,.snapshot-card ul,.snapshot-card dd{margin:0}
.snapshot-card h3{font-size:1.12rem;letter-spacing:-.035em}.snapshot-card h4{font-size:1rem}
.snapshot-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(98px,1fr));gap:14px 8px;padding:16px 18px}
.snapshot-stats dt{font-size:.8rem;color:#51675d}.snapshot-stats dd{font-size:1.05rem;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.snapshot-card section{border-top:1px solid #e6ece7;padding:14px 18px}.snapshot-group,.snapshot-card li{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.snapshot-card ul{padding:0;list-style:none}.snapshot-card li{font-size:.94rem;margin-top:8px;overflow-wrap:anywhere}.snapshot-card li small{text-align:right;max-width:53%}
.snapshot-dialog{display:grid;gap:14px}.snapshot-dialog p{margin:0;line-height:1.5}.snapshot-actions{display:flex;flex-wrap:wrap;gap:8px}.snapshot-actions a,.snapshot-actions button{flex:1;justify-content:center;text-decoration:none;min-height:44px}
.snapshot-links{border-top:1px solid #dde5df;padding-top:12px}.snapshot-links summary{cursor:pointer;font-weight:600}.snapshot-links>div{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}.snapshot-links small{display:block}
.day-share-button{display:inline-flex;align-items:center;gap:6px}.day-share-toolbar{display:flex;justify-content:flex-end}
.strength-fields{display:grid;gap:10px;border:1px solid var(--line);border-radius:12px;margin:0;padding:12px}.strength-fields legend{font-weight:600}.strength-fields legend small{font-weight:400}.strength-fields .field{min-width:0}
body:has(.public-snapshot){margin:0;background:#f5f8f5;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#193c2e}
.public-snapshot{max-width:530px;margin:0 auto;padding:32px 16px 60px}.snapshot-brand{display:inline-flex;align-items:center;gap:7px;font-weight:700;text-decoration:none;color:inherit}.snapshot-brand img{width:24px;height:24px}.public-snapshot h1{font-size:2.2rem;letter-spacing:-.055em;margin:32px 0 0}.public-snapshot>p{color:#52665e;margin:5px 0 18px}

.day-link-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;border:0;padding:0;margin:0;min-width:0}
.day-link-modes legend{font-weight:650;margin:0 0 8px}.day-link-modes label{display:flex;align-items:flex-start;gap:9px;padding:12px;border:1px solid #d7ded9;border-radius:12px;cursor:pointer}
.day-link-modes label:has(:checked){background:#edf7f1;border-color:#498164}.day-link-modes input[type=radio]{width:16px;height:16px;min-height:0;flex:none;margin:3px 0 0;accent-color:#236648}
.day-link-modes small{display:block;color:#52665e;font-size:.85rem;line-height:1.4;margin-top:3px}.snapshot-empty{padding:16px 18px;margin:0;color:#51675d}
.public-snapshot .live-caption{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.live-flag{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:650;color:#216341}.live-flag::before{content:"";width:7px;height:7px;background:#357c58;border-radius:50%}
